name: miae01-dqn
# 与 Colab 免费层共用同一套 ALE 栈（见同目录 requirements.txt）。
# 本地用本文件（conda + pip），Colab 用 requirements.txt。
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
      # --- 已验证的核心 ALE 栈（Python 3.12.16 / numpy 2.5.4 实测通过）---
      - gymnasium==1.0.0
      - ale-py==0.10.1        # ROM 已随包分发（108 个，672 KB），无需 AutoROM
      - numpy==2.5.4
      - opencv-python-headless==5.0.0.93   # gymnasium 的 ResizeObservation 需要
      - tensorboard==2.21.0
      # --- 训练用；Colab 自带 CUDA 版，不要写进 requirements.txt ---
      # 无 GPU 的机器建议改用 CPU 轮子（约 200 MB，避免拉 2.4 GB 的 CUDA 包）：
      #   pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
      - torch==2.4.1
      # --- 测试用 ---
      - pytest==9.2.0
